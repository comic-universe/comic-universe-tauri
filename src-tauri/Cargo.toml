[package]
name = "comic-universe-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "comic_universe_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.7", features = ["cors"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
sea-query = "1.0"
sea-query-rusqlite = { version = "0.8", features = ["with-json"] }
zip = "8.6"
mime_guess = "2.0.5"
tauri-plugin-deep-link = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
